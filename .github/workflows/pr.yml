name: pr-to-main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration=development

      - name: Test
        run: npm run test:ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/app/

  dast-baseline:
    name: ZAP DAST Baseline
    needs: build
    runs-on: ubuntu-latest
    # G2 (conv-infrastructure-testing.md §6.3): passive scan with Ajax Spider
    # (Angular SPA — default spider only sees index.html), non-blocking.
    # WARN-level findings are surfaced only via the uploaded HTML report.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration=development

      - name: Serve static bundle
        run: npx serve -s dist/angular -p 8080 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080; then exit 0; fi
            sleep 1
          done
          echo "Static server did not become ready in time"
          exit 1

      # FAIL/WARN/IGNORE ruleset vendored from eudistack-platform-dev's
      # dev-tools/testing/baseline/zap/zap-baseline.conf (single source of truth
      # per convention §5.3) — copied here to avoid a cross-repo read token.
      - name: ZAP Baseline Scan (Ajax Spider)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-j'
          rules_file_name: 'dev-tools/testing/zap/zap-baseline.conf'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
